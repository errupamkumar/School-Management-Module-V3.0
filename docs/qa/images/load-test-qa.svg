 font-size="12.5" font-weight="700" fill="#0b0b0b">✗ FAIL</text><line x1="250" y1="106" x2="250" y2="512" stroke="#bdbcb6"/><text x="28" y="574" font-size="12" fill="#52514e">Throughput tops out near 60 requests/s on one Node process; on Vercel each region scales out to more instances.</text><text x="28" y="593" font-size="12" fill="#52514e">¹ Sign-in uses wrong passwords, so every response is meant to be 401. It fails on time: one CPU-bound bcrypt hash per attempt.</text></svg>
