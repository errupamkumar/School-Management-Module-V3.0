<title id="t">Load test on the QA copy: 95th-percentile response time per stage</title>
<desc id="d">Smoke · mixed, 1 concurrent: p95 116 ms, 21.7 requests per second, pass; Owner dashboard only, 10 concurrent: p95 468 ms, 23.9 requests per second, pass; Website home (cached), 10 concurrent: p95 142 ms, 85.6 requests per second, pass; Average load · mixed, 25 concurrent: p95 1.13 s, 59.1 requests per second, fail; Stress · mixed, 50 concurrent: p95 2.25 s, 61.1 requests per second, fail; Stress · mixed, 100 concurrent: p95 4.60 s, 59.9 requests per second, fail; Stress · mixed, 200 concurrent: p95 9.15 s, 65.4 requests per second, fail; Spike · mixed, 400 concurrent: p95 19.8 s, 46.5 requests per second, fail; Sign-in (wrong passwords), 20 concurrent: p95 18.9 s, 0.7 requests per second, fail; Recovery · mixed, 25 concurrent: p95 1.25 s, 47.5 requests per second, fail.</desc>
