<title id="t">Live site vs QA copy: the same requests</title>
<desc id="d">GET /api/me: live 3.76 s, QA 26 ms; GET /api/dashboard: live 12.1 s, QA 124 ms; POST sign-in: live 11.1 s, QA 822 ms. Log scale.</desc>
<rect x="0.5" y="0.5" width="959" height="439" rx="14" fill="#fcfcfb" stroke="#e2e8f0"/>
<text x="28" y="40" font-size="19" font-weight="700" fill="#0b0b0b">Same code, same data: where the app runs decides the speed</text>
<text x="28" y="61" font-size="12.5" fill="#52514e">Warm requests, median of 3 · response time on a log scale · measured 9 Nov 2026</text>
<rect x="28" y="78" width="12" height="12" rx="3" fill="#eb6834"/><text x="46" y="89" font-size="12.5" fill="#0b0b0b">Live site: functions in Washington (iad1), database in Singapore</text>
