<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d">
  <title id="t">Why sign-in failed, and the same path after the fix</title>
  <desc id="d">Before the fix, the sign-in request reached a Prisma query, Prisma could not find DATABASE_URL, and the form showed the generic invalid credentials message. After the fix, Prisma reaches TiDB, the user is found and a Super Admin session is created.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <style>
      text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #1e293b; }
      .title { font-size: 19px; font-weight: 700; }
      .lane { font-size: 13px; font-weight: 700; letter-spacing: .04em; }
      .t { font-size: 12.5px; }
      .b { font-size: 12.5px; font-weight: 700; }
      .mono { font-family: Consolas, 'Courier New', monospace; font-size: 11.5px; }
      .note { font-size: 12px; fill: #475569; }
      .run { stroke: #475569; stroke-width: 1.8; fill: none; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="419" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="28" y="40" class="title">Why sign-in said “Invalid school code, username or password”</text>

  <!-- Before -->
  <text x="28" y="80" class="lane" style="fill:#b91c1c">BEFORE THE FIX — no DATABASE_URL in Vercel</text>
  <g>
    <rect x="28" y="94" width="160" height="78" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="108" y="126" class="b" text-anchor="middle">Sign-in form</text>
    <text x="108" y="147" class="mono" text-anchor="middle">DEMO · owner · ••••</text>

    <rect x="214" y="94" width="160" height="78" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="294" y="126" class="mono" text-anchor="middle">POST /api/auth/</text>
    <text x="294" y="144" class="mono" text-anchor="middle">callback/credentials</text>

    <rect x="400" y="94" width="160" height="78" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="480" y="126" class="b" text-anchor="middle">Rate-limit check</text>
    <text x="480" y="147" class="t" text-anchor="middle">runs a Prisma query</text>

    <rect x="586" y="94" width="160" height="78" rx="10" fill="#fee2e2" stroke="#ef4444"/>
    <text x="666" y="120" class="b" text-anchor="middle" style="fill:#991b1b">✗ Prisma error</text>
    <text x="666" y="140" class="t" text-anchor="middle" style="fill:#991b1b">“Environment variable</text>
    <text x="666" y="157" class="t" text-anchor="middle" style="fill:#991b1b">not found: DATABASE_URL”</text>

    <rect x="772" y="94" width="160" height="78" rx="10" fill="#fff7ed" stroke="#f97316"/>
    <text x="852" y="120" class="t" text-anchor="middle" style="fill:#9a3412">Form shows “Invalid</text>
    <text x="852" y="137" class="t" text-anchor="middle" style="fill:#9a3412">school code, username</text>
    <text x="852" y="154" class="t" text-anchor="middle" style="fill:#9a3412">or password.”</text>

    <path d="M188 133 H212" class="run" marker-end="url(#arrow)"/>
    <path d="M374 133 H398" class="run" marker-end="url(#arrow)"/>
    <path d="M560 133 H584" class="run" marker-end="url(#arrow)"/>
    <path d="M746 133 H770" class="run" marker-end="url(#arrow)"/>
  </g>

  <!-- After -->
  <text x="28" y="222" class="lane" style="fill:#15803d">AFTER THE FIX — DATABASE_URL points at TiDB</text>
  <g>
    <rect x="28" y="236" width="160" height="78" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="108" y="268" class="b" text-anchor="middle">Sign-in form</text>
    <text x="108" y="289" class="mono" text-anchor="middle">DEMO · owner · ••••</text>

    <rect x="214" y="236" width="160" height="78" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="294" y="268" class="mono" text-anchor="middle">POST /api/auth/</text>
    <text x="294" y="286" class="mono" text-anchor="middle">callback/credentials</text>

    <rect x="400" y="236" width="160" height="78" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="480" y="268" class="b" text-anchor="middle">Prisma → TiDB</text>
    <text x="480" y="289" class="t" text-anchor="middle">TLS, port 4000</text>

    <rect x="586" y="236" width="160" height="78" rx="10" fill="#dcfce7" stroke="#22c55e"/>
    <text x="666" y="268" class="b" text-anchor="middle" style="fill:#166534">✓ User found</text>
    <text x="666" y="289" class="t" text-anchor="middle" style="fill:#166534">password verified</text>

    <rect x="772" y="236" width="160" height="78" rx="10" fill="#dcfce7" stroke="#22c55e"/>
    <text x="852" y="268" class="b" text-anchor="middle" style="fill:#166534">Session created</text>
    <text x="852" y="289" class="t" text-anchor="middle" style="fill:#166534">Super Admin dashboard</text>

    <path d="M188 275 H212" class="run" marker-end="url(#arrow)"/>
    <path d="M374 275 H398" class="run" marker-end="url(#arrow)"/>
    <path d="M560 275 H584" class="run" marker-end="url(#arrow)"/>
    <path d="M746 275 H770" class="run" marker-end="url(#arrow)"/>
  </g>

  <line x1="28" y1="344" x2="932" y2="344" stroke="#e2e8f0"/>
  <text x="28" y="370" class="note">The sign-in code turns every failure into the same message, so a missing database looked exactly like a wrong password.</text>
  <text x="28" y="392" class="note">It was found by calling the live API directly: the error URL that came back contained Prisma’s own message.</text>
</svg>
