<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-labelledby="t d">
  <title id="t">Anatomy of the DATABASE_URL</title>
  <desc id="d">mysql://USER:PASSWORD@HOST:4000/vidyalaya?sslaccept=strict&amp;connection_limit=5, split into its parts: protocol, username, password, host, port, database name, TLS setting and connection pool size.</desc>
  <defs>
    <style>
      text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #1e293b; }
      .title { font-size: 19px; font-weight: 700; }
      .sub { font-size: 12.5px; fill: #64748b; }
      .seg { font-family: Consolas, 'Courier New', monospace; font-size: 15px; font-weight: 700; }
      .h { font-size: 12px; font-weight: 700; }
      .t { font-size: 11.5px; fill: #475569; }
      .lead { stroke: #94a3b8; stroke-width: 1.2; }
      .note { font-size: 12px; fill: #475569; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="279" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="28" y="38" class="title">Anatomy of the DATABASE_URL</text>
  <text x="932" y="38" class="sub" text-anchor="end">values in CAPITALS come from TiDB → Connect</text>

  <!-- Segments: textLength keeps every chip the same width whatever monospace font is installed -->
  <g text-anchor="middle">
    <rect x="28" y="104" width="86" height="34" rx="6" fill="#ede9fe"/><text x="71" y="127" class="seg" textLength="72" lengthAdjust="spacingAndGlyphs" style="fill:#5b21b6">mysql://</text>
    <rect x="116" y="104" width="49" height="34" rx="6" fill="#dbeafe"/><text x="140.5" y="127" class="seg" textLength="36" lengthAdjust="spacingAndGlyphs" style="fill:#1e40af">USER</text>
    <rect x="167" y="104" width="21" height="34" rx="6" fill="#f1f5f9"/><text x="177.5" y="127" class="seg" style="fill:#64748b">:</text>
    <rect x="190" y="104" width="86" height="34" rx="6" fill="#fee2e2"/><text x="233" y="127" class="seg" textLength="72" lengthAdjust="spacingAndGlyphs" style="fill:#991b1b">PASSWORD</text>
    <rect x="278" y="104" width="21" height="34" rx="6" fill="#f1f5f9"/><text x="288.5" y="127" class="seg" style="fill:#64748b">@</text>
    <rect x="301" y="104" width="49" height="34" rx="6" fill="#dbeafe"/><text x="325.5" y="127" class="seg" textLength="36" lengthAdjust="spacingAndGlyphs" style="fill:#1e40af">HOST</text>
    <rect x="352" y="104" width="21" height="34" rx="6" fill="#f1f5f9"/><text x="362.5" y="127" class="seg" style="fill:#64748b">:</text>
    <rect x="375" y="104" width="49" height="34" rx="6" fill="#dbeafe"/><text x="399.5" y="127" class="seg" textLength="36" lengthAdjust="spacingAndGlyphs" style="fill:#1e40af">4000</text>
    <rect x="426" y="104" width="21" height="34" rx="6" fill="#f1f5f9"/><text x="436.5" y="127" class="seg" style="fill:#64748b">/</text>
    <rect x="449" y="104" width="95" height="34" rx="6" fill="#dcfce7"/><text x="496.5" y="127" class="seg" textLength="81" lengthAdjust="spacingAndGlyphs" style="fill:#166534">vidyalaya</text>
    <rect x="546" y="104" width="21" height="34" rx="6" fill="#f1f5f9"/><text x="556.5" y="127" class="seg" style="fill:#64748b">?</text>
    <rect x="569" y="104" width="159" height="34" rx="6" fill="#fef3c7"/><text x="648.5" y="127" class="seg" textLength="144" lengthAdjust="spacingAndGlyphs" style="fill:#92400e">sslaccept=strict</text>
    <rect x="730" y="104" width="21" height="34" rx="6" fill="#f1f5f9"/><text x="740.5" y="127" class="seg" style="fill:#64748b">&amp;</text>
    <rect x="753" y="104" width="178" height="34" rx="6" fill="#fef3c7"/><text x="842" y="127" class="seg" textLength="162" lengthAdjust="spacingAndGlyphs" style="fill:#92400e">connection_limit=5</text>
  </g>

  <!-- Labels above -->
  <g text-anchor="middle">
    <line x1="71" y1="86" x2="71" y2="104" class="lead"/>
    <text x="71" y="62" class="h">Protocol</text><text x="71" y="78" class="t">MySQL-compatible</text>
    <line x1="233" y1="86" x2="233" y2="104" class="lead"/>
    <text x="233" y="62" class="h">PASSWORD</text><text x="233" y="78" class="t">URL-encode any symbols</text>
    <line x1="399.5" y1="86" x2="399.5" y2="104" class="lead"/>
    <text x="399.5" y="62" class="h">PORT</text><text x="399.5" y="78" class="t">4000 on TiDB Cloud</text>
    <line x1="648.5" y1="86" x2="648.5" y2="104" class="lead"/>
    <text x="648.5" y="62" class="h">TLS on</text><text x="648.5" y="78" class="t">encrypt and verify the server</text>
  </g>

  <!-- Labels below -->
  <g text-anchor="middle">
    <line x1="140.5" y1="138" x2="140.5" y2="156" class="lead"/>
    <text x="140.5" y="172" class="h">USERNAME</text><text x="140.5" y="188" class="t">looks like</text><text x="140.5" y="203" class="t">xxxxxxxx.root</text>
    <line x1="325.5" y1="138" x2="325.5" y2="156" class="lead"/>
    <text x="325.5" y="172" class="h">HOST</text><text x="325.5" y="188" class="t">gateway01.ap-southeast-1</text><text x="325.5" y="203" class="t">.prod.aws.tidbcloud.com</text>
    <line x1="496.5" y1="138" x2="496.5" y2="156" class="lead"/>
    <text x="496.5" y="172" class="h">Database</text><text x="496.5" y="188" class="t">“vidyalaya”, not “sys”;</text><text x="496.5" y="203" class="t">db push creates it</text>
    <line x1="842" y1="138" x2="842" y2="156" class="lead"/>
    <text x="842" y="172" class="h">Connection pool</text><text x="842" y="188" class="t">a small pool per</text><text x="842" y="203" class="t">serverless function</text>
  </g>

  <line x1="28" y1="226" x2="932" y2="226" stroke="#e2e8f0"/>
  <text x="28" y="250" class="note">TiDB Cloud’s certificate is signed by a public authority, so “strict” works without uploading a CA file to Vercel.</text>
  <text x="28" y="268" class="note">The full string contains the password: keep it only in Vercel and in a local file outside the repository.</text>
</svg>
