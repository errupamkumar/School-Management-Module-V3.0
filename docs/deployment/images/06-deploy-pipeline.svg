<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="t d">
  <title id="t">How code and settings reach production</title>
  <desc id="d">A push to the main branch on GitHub triggers a Vercel build: npm install, prisma generate, next build. The result is an immutable deployment that is aliased to the production domain. vercel redeploy rebuilds the live commit so new environment variables take effect.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <style>
      text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #1e293b; }
      .title { font-size: 19px; font-weight: 700; }
      .lane { font-size: 12px; font-weight: 700; fill: #64748b; letter-spacing: .05em; }
      .h { font-size: 13px; font-weight: 700; }
      .t { font-size: 12px; }
      .s { font-size: 11.5px; fill: #475569; }
      .mono { font-family: Consolas, 'Courier New', monospace; font-size: 11.5px; fill: #334155; }
      .run { stroke: #475569; stroke-width: 1.8; fill: none; }
      .alt { stroke: #7c3aed; stroke-width: 1.8; fill: none; stroke-dasharray: 6 4; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="329" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="28" y="40" class="title">How code and settings reach production</text>
  <text x="28" y="72" class="lane">NORMAL PATH — EVERY PUSH TO MAIN</text>

  <rect x="28" y="84" width="140" height="96" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="98" y="114" class="h" text-anchor="middle">git push</text>
  <text x="98" y="136" class="mono" text-anchor="middle">origin main</text>
  <text x="98" y="160" class="s" text-anchor="middle">from the laptop</text>

  <rect x="184" y="84" width="150" height="96" rx="10" fill="#f8fafc" stroke="#334155"/>
  <text x="259" y="114" class="h" text-anchor="middle">GitHub</text>
  <text x="259" y="136" class="t" text-anchor="middle">commit on main</text>
  <text x="259" y="160" class="s" text-anchor="middle">webhook → Vercel</text>

  <rect x="350" y="84" width="240" height="96" rx="10" fill="#f5f3ff" stroke="#a78bfa"/>
  <text x="470" y="108" class="h" text-anchor="middle">Vercel build (about 2 min)</text>
  <text x="366" y="130" class="mono">1  npm install</text>
  <text x="366" y="148" class="mono">2  postinstall: prisma generate</text>
  <text x="366" y="166" class="mono">3  next build</text>

  <rect x="606" y="84" width="160" height="96" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="686" y="114" class="h" text-anchor="middle">Deployment</text>
  <text x="686" y="136" class="t" text-anchor="middle">immutable URL</text>
  <text x="686" y="160" class="mono" text-anchor="middle">…-315rxbskx-….app</text>

  <rect x="782" y="84" width="150" height="96" rx="10" fill="#dcfce7" stroke="#22c55e"/>
  <text x="857" y="114" class="h" text-anchor="middle" style="fill:#166534">Live domain</text>
  <text x="857" y="136" class="mono" text-anchor="middle">school-management-</text>
  <text x="857" y="152" class="mono" text-anchor="middle">module-v3-0</text>
  <text x="857" y="168" class="mono" text-anchor="middle">.vercel.app</text>

  <path d="M168 132 H182" class="run" marker-end="url(#arrow)"/>
  <path d="M334 132 H348" class="run" marker-end="url(#arrow)"/>
  <path d="M590 132 H604" class="run" marker-end="url(#arrow)"/>
  <path d="M766 132 H780" class="run" marker-end="url(#arrow)"/>

  <text x="28" y="222" class="lane" style="fill:#7c3aed">SETTINGS-ONLY PATH — AFTER CHANGING VARIABLES</text>
  <rect x="28" y="234" width="306" height="64" rx="10" fill="#faf5ff" stroke="#a78bfa"/>
  <text x="44" y="259" class="mono" style="fill:#5b21b6">vercel redeploy &lt;live deployment URL&gt;</text>
  <text x="44" y="277" class="mono" style="fill:#5b21b6">  --target production</text>
  <path d="M334 266 H470 V182" class="alt" marker-end="url(#arrow)"/>
  <text x="480" y="252" class="t" style="fill:#5b21b6">rebuilds the same commit with the current variables;</text>
  <text x="480" y="270" class="t" style="fill:#5b21b6">variables are read at build and run time, so a rebuild is required</text>
  <text x="28" y="320" class="s">Avoid “vercel --prod” from the laptop: it uploads the local working folder, including any uncommitted changes.</text>
</svg>
