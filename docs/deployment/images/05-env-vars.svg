<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" width="960" height="370" role="img" aria-labelledby="t d">
  <title id="t">The four production environment variables</title>
  <desc id="d">DATABASE_URL connects Prisma to TiDB. NEXTAUTH_SECRET signs session cookies. NEXTAUTH_URL is the base address for sign-in callbacks. DATA_ENCRYPTION_KEY encrypts sensitive fields. Each row shows what breaks when the variable is missing or wrong.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <style>
      text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #1e293b; }
      .title { font-size: 19px; font-weight: 700; }
      .col { font-size: 11.5px; font-weight: 700; fill: #64748b; letter-spacing: .06em; }
      .var { font-family: Consolas, 'Courier New', monospace; font-size: 14px; font-weight: 700; fill: #92400e; }
      .t { font-size: 12.5px; }
      .s { font-size: 11.5px; fill: #475569; }
      .bad { font-size: 12px; fill: #991b1b; }
      .run { stroke: #94a3b8; stroke-width: 1.6; fill: none; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="369" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="28" y="40" class="title">The four production environment variables</text>
  <text x="28" y="74" class="col">VARIABLE</text>
  <text x="318" y="74" class="col">WHAT IT POWERS</text>
  <text x="660" y="74" class="col">IF IT IS MISSING OR WRONG</text>

  <g>
    <rect x="28" y="86" width="250" height="56" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
    <text x="44" y="111" class="var">DATABASE_URL</text><text x="44" y="130" class="s">TiDB connection string</text>
    <path d="M278 114 H314" class="run" marker-end="url(#arrow)"/>
    <text x="318" y="110" class="t">Prisma’s connection to TiDB: every page</text><text x="318" y="128" class="t">and API that reads or writes data</text>
    <text x="660" y="110" class="bad">Sign-in fails, data APIs return 500.</text><text x="660" y="128" class="bad">This was the original bug.</text>
  </g>
  <g>
    <rect x="28" y="152" width="250" height="56" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
    <text x="44" y="177" class="var">NEXTAUTH_SECRET</text><text x="44" y="196" class="s">48 random bytes, base64</text>
    <path d="M278 180 H314" class="run" marker-end="url(#arrow)"/>
    <text x="318" y="176" class="t">Signs and checks the session cookie</text><text x="318" y="194" class="t">(JWT) after sign-in</text>
    <text x="660" y="176" class="bad">Production refuses to sign anyone in</text><text x="660" y="194" class="bad">if it is shorter than 32 characters.</text>
  </g>
  <g>
    <rect x="28" y="218" width="250" height="56" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
    <text x="44" y="243" class="var">NEXTAUTH_URL</text><text x="44" y="262" class="s">https://…v3-0.vercel.app</text>
    <path d="M278 246 H314" class="run" marker-end="url(#arrow)"/>
    <text x="318" y="242" class="t">Base address for sign-in callbacks</text><text x="318" y="260" class="t">and redirects</text>
    <text x="660" y="242" class="bad">Redirects go to the wrong host</text><text x="660" y="260" class="bad">after signing in or out.</text>
  </g>
  <g>
    <rect x="28" y="284" width="250" height="56" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
    <text x="44" y="309" class="var">DATA_ENCRYPTION_KEY</text><text x="44" y="328" class="s">32 random bytes, base64</text>
    <path d="M278 312 H314" class="run" marker-end="url(#arrow)"/>
    <text x="318" y="308" class="t">Encrypts sensitive fields such as Aadhaar</text><text x="318" y="326" class="t">and payment-gateway credentials</text>
    <text x="660" y="308" class="bad">Encryption calls throw. Changing it later</text><text x="660" y="326" class="bad">makes existing encrypted data unreadable.</text>
  </g>
  <text x="28" y="360" class="s">All four are set for the Production environment as sensitive (write-only) variables. Keep your own copy of both secrets in a password manager.</text>
</svg>
